    <!-- 本文 -->
    <div class="novel-body"
20歳からの人生は余生な気がする。もう死んでる気がする、ならば生き続けることに意味があるのかな。でもそんなことを考えているのは彼氏に申し訳ないな。
と思っていたけど、うゆさきなの曲を聞いたらそれでもいいのかと思った。ただのアイドルの歌詞で、知らない大人が書いたものなら同じ詩でも響かなかったと思うけど、
頓知気がその詩を書いたことを考えると救われる。死んでると思っててもいいのかなって。たまたま続いている夢で、なんとなくやってきた人生なのに今こうして幸せなのはラッキーとして
受け入れてもいいんだな～と思った。
    </div>
