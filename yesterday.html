
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yesterday</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="yesterday.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="yesterday.js" defer></script>
</head>

<body class="yesterday-page">
  <main>

    <h1>yesterday</h1>
    <p class="novel-lead">昨日ともう会えないのなら、ちゃんとしたお別れをして</p>

    <!-- 追従ヘッダー -->
    <div class="diary-toolbar" id="toolbar">
      <div class="diary-toolbar-row">
        <button id="archive-toggle" aria-expanded="false">
          <span id="current-month"></span>
          <span>⌄</span>
        </button>
        <button id="write-toggle" hidden>write</button>
      </div>

      <div id="archive" hidden>
        <div class="archive-year">
          <button id="prev-year" aria-label="前年">‹</button>
          <span id="archive-year"></span>
          <button id="next-year" aria-label="翌年">›</button>
        </div>
        <div id="archive-months" class="archive-months"></div>
      </div>
    </div>

    <!-- 日記記入欄 -->
    <form id="composer" class="diary-form" hidden>
      <label>
        日付
        <input id="entry-date" type="date" required>
      </label>

      <textarea id="entry-body"
        aria-label="日記本文"
        placeholder="昨日のこと。"
        rows="7" required></textarea>

      <div class="diary-actions">
        <span id="draft-status" class="diary-note"></span>
        <button type="submit">save</button>
      </div>

      <p id="composer-message" class="diary-note" role="status"></p>
    </form>

    <!-- 日記一覧 -->
    <div id="entries"></div>
    <p id="page-message" class="diary-note" role="status"></p>

    <noscript>
      日記の表示にはJavaScriptが必要です。
    </noscript>

  </main>

  <hr>

  <!-- ページ下部 -->
  <div class="diary-footer">
    <a href="index.html">はじまりへ</a>
    <button id="login-toggle">login</button>
  </div>

  <!-- ログイン欄 -->
  <form id="login-form" class="diary-form login-form" hidden>
    <input id="login-email"
      type="email"
      placeholder="email"
      aria-label="メールアドレス"
      autocomplete="username"
      required>

    <input id="login-password"
      type="password"
      placeholder="password"
      aria-label="パスワード"
      autocomplete="current-password"
      required>

    <div class="diary-actions">
      <button type="submit">enter →</button>
    </div>

    <p id="login-message" class="diary-note" role="status"></p>
  </form>

</body>
</html>
