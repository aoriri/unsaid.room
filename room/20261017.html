    スポッチャに行った。人生初。大学の友達と行ったけど、その中に彼氏もいて彼氏のたのしそうな顔がずっと見れて新鮮だった。日記を書こうと思って一日を思い返したら
    彼氏のことばかり妙に細かく覚えていて、自分が思っていた以上にずっと彼のことを見ていたらしいと気づいた。
    わたしだけ彼氏にメロついててごめんって感じだけど。彼氏は運動好きでわたしは運動が苦手。だから普段彼氏と運動なんてしないから新しい顔が見れたような気がしてとてもよかった。
    バッティングで得意げになってやっていた姿。バスケやバトミントンで倒れ込むくらいまではしゃいでいた姿。ずっとたのしそうにニコニコしていてかわいかった。<br>
    普段の集まりよりも小規模で4人だったからか、たくさん話したような気がする。16時からスポッチャに行って20時か21時くらいにスポッチャを出て、そのあと居酒屋で3時間ぐらいいた気がするし、
    そのあとダーツをまた3時間くらいして、4時から6時までその場でおしゃべりして、帰る時も池袋から定期の駅まで歩いて30分は話してた。普段話すエピソードトークだけじゃなくて
    内心みたいな話もできて新鮮だった。とはいえ内心の話に関しては彼氏と普段話してることと大体一緒だったけど、でも友達の前で使う言葉の違いがあってそれは別側面のようにも感じた。<br>
    毎回みんなで遊ぶときに思うのが、みんなでいるときとふたりのときの彼氏は違うのがメロすぎ。公表してないので友達として一緒にいて、その顔が見えるのがいい。
    まあそう思ってるのも今回わたしが彼氏の顔ばっか見ていたのもわたしだけなんだと思うと悲しくなってくる。思い込みとかではなく絶対そうな気がする。根拠はないけど、でも彼氏は
    そういうふうに考えない性格な気がする。わたしばっかり好きな気がして病んできたな……。
